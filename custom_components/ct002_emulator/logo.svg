<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Hintergrund-Farbverlauf -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Stromkabel / Phasenleiter (Warmes Energie-Orange) -->
    <linearGradient id="cableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- CT-Messzange & Sensor-Gradient -->
    <linearGradient id="clampGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Messwert- & Smart-Meter-Gradient (Cyan / Smaragdgrün) -->
    <linearGradient id="meterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Glow Filter für Messeffekte -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Abgerundetes Icon-Gehäuse (Home Assistant Standard) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />

  <!-- ====================================================================== -->
  <!-- 1. STROMKABEL / LEITER (Wird von der CT-Zange gemessen)                 -->
  <!-- ====================================================================== -->
  <rect x="135" y="45" width="22" height="422" rx="11" fill="url(#cableGrad)" opacity="0.85" />
  <line x1="146" y1="55" x2="146" y2="457" stroke="#FFF" stroke-width="4" stroke-linecap="round" opacity="0.6" filter="url(#glow)" />
  
  <!-- Wechselstrom AC-Sinuswelle auf dem Kabel -->
  <path d="M146 70 Q160 85 146 100 T146 130" fill="none" stroke="#FFF" stroke-width="3" opacity="0.7" />
  <path d="M146 380 Q160 395 146 410 T146 440" fill="none" stroke="#FFF" stroke-width="3" opacity="0.7" />

  <!-- ====================================================================== -->
  <!-- 2. CT-STROMWANDLER / MESSZANGE (Umschließt das Kabel)                   -->
  <!-- ====================================================================== -->
  <!-- Magnetisches Messfeld / Induktionslinien im Zangeninneren -->
  <ellipse cx="146" cy="225" rx="42" ry="42" fill="none" stroke="#00F5FF" stroke-width="3" stroke-dasharray="6 6" opacity="0.8" filter="url(#glow)" />
  <ellipse cx="146" cy="225" rx="30" ry="30" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />

  <!-- Linke Backe der Messzange -->
  <path d="M146 155 C90 155 65 185 65 225 C65 265 90 295 146 295" 
        fill="none" stroke="url(#clampGrad)" stroke-width="26" stroke-linecap="round" />

  <!-- Rechte Backe / Scharnier & Zangenkörper -->
  <path d="M146 155 C190 155 215 180 215 225 C215 265 190 295 146 295" 
        fill="none" stroke="url(#clampGrad)" stroke-width="26" stroke-linecap="round" />
  
  <!-- Zangenverschluss / Mess-Trennstelle oben -->
  <line x1="146" y1="142" x2="146" y2="168" stroke="#0B1120" stroke-width="8" stroke-linecap="round" />
  <!-- Gelenk / Scharnier-Punkt unten -->
  <circle cx="95" cy="225" r="7" fill="#E2E8F0" />

  <!-- ====================================================================== -->
  <!-- 3. MESS-INSTRUMENT / SMART METER GAUGE (Zifferblatt & Zeiger)          -->
  <!-- ====================================================================== -->
  <!-- Verbindung von Messzange zur Messuhr -->
  <path d="M215 225 L260 225" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" />

  <!-- Messuhr-Kreis -->
  <circle cx="345" cy="225" r="95" fill="#0F172A" stroke="url(#meterGrad)" stroke-width="8" filter="url(#glow)" />

  <!-- Skalenstriche / Mess-Ticks -->
  <!-- 0W Ticks (Links/Unten) -->
  <line x1="275" y1="265" x2="285" y2="258" stroke="#64748B" stroke-width="3" stroke-linecap="round" />
  <line x1="262" y1="225" x2="274" y2="225" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />
  <line x1="275" y1="185" x2="285" y2="192" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />
  <line x1="305" y1="155" x2="312" y2="167" stroke="#00F5FF" stroke-width="4" stroke-linecap="round" />
  <!-- Max Power Ticks (Oben/Rechts) -->
  <line x1="345" y1="142" x2="345" y2="156" stroke="#00F5FF" stroke-width="5" stroke-linecap="round" />
  <line x1="385" y1="155" x2="378" y2="167" stroke="#10B981" stroke-width="4" stroke-linecap="round" />
  <line x1="415" y1="185" x2="405" y2="192" stroke="#10B981" stroke-width="4" stroke-linecap="round" />
  <line x1="428" y1="225" x2="416" y2="225" stroke="#10B981" stroke-width="4" stroke-linecap="round" />

  <!-- Watt-Einheit "W" -->
  <text x="345" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" fill="#00F5FF" text-anchor="middle" letter-spacing="1">W</text>

  <!-- Dynamischer Messzeiger (steht dynamisch auf aktiver Last) -->
  <circle cx="345" cy="225" r="10" fill="#E2E8F0" />
  <line x1="345" y1="225" x2="380" y2="165" stroke="#EF4444" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />
  <circle cx="345" cy="225" r="4" fill="#EF4444" />

  <!-- ====================================================================== -->
  <!-- 4. BATTERIE-SPEICHER (Unten - Nimmt den Messwert auf)                   -->
  <!-- ====================================================================== -->
  <!-- Datenleitung von Messuhr zur Batterie -->
  <path d="M345 320 L345 355" fill="none" stroke="#10B981" stroke-width="6" stroke-dasharray="8 6" stroke-linecap="round" />

  <!-- Batteriegehäuse -->
  <rect x="290" y="375" width="110" height="60" rx="14" fill="#1E293B" stroke="#64748B" stroke-width="6" />
  <!-- Batterie-Pol rechts -->
  <rect x="403" y="394" width="8" height="22" rx="4" fill="#94A3B8" />

  <!-- Dynamische Ladebalken im Speicher -->
  <rect x="304" y="388" width="22" height="34" rx="5" fill="#10B981" />
  <rect x="334" y="388" width="22" height="34" rx="5" fill="#10B981" />
  <rect x="364" y="388" width="22" height="34" rx="5" fill="#10B981" opacity="0.4" />
</svg>
